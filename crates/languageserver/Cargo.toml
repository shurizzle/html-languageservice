[package]
name = "html-languageserver"
version = "0.1.0"
edition = "2024"
description = "LSP server for HTML built on html-languageservice"
license = "MIT"

[[bin]]
name = "html-languageserver"
path = "src/main.rs"

[dependencies]
html-languageservice = { path = "../languageservice" }
crossbeam-channel = "0.5"
lsp-server = "0.10"
lsp-types = "0.97"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"
url = "2"
